<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Geometric Waveform Generator</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #1a1a1a;
            --text-color: #eee;
            --accent: #00adb5;
        }
        body {
            margin: 0; font-family: -apple-system, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            display: flex; height: 100vh; overflow: hidden;
        }
        #sidebar {
            width: 320px; background: var(--panel-bg); padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.8); overflow-y: auto; z-index: 10;
        }
        #canvas-container {
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
        }
        canvas { background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.9); }
        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 10px;}
        .control-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #aaa; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .val-display { float: right; color: var(--accent); font-weight: bold; }
        select, input[type="color"] { width: 100%; padding: 5px; background: #333; color: white; border: 1px solid #444; border-radius: 4px; }
        button {
            width: 100%; padding: 10px; background: var(--accent); color: #000; border: none;
            border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        button:hover { background: #008c93; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Geometric Controls</h2>

        <div class="control-group">
            <label>Generator Mode</label>
            <select id="mode">
                <option value="polarWave">Polar Waveform</option>
                <option value="mandala">Mandala Circles</option>
            </select>
        </div>

        <div class="control-group">
            <label>Wave Frequency / Petals <span id="freqVal" class="val-display">8</span></label>
            <input type="range" id="freq" min="1" max="100" value="8">
        </div>
        <div class="control-group">
            <label>Wave Amplitude / Offset <span id="ampVal" class="val-display">50</span></label>
            <input type="range" id="amp" min="0" max="300" value="50">
        </div>
        <div class="control-group">
            <label>Base Radius <span id="radiusVal" class="val-display">150</span></label>
            <input type="range" id="radius" min="10" max="400" value="150">
        </div>
        <div class="control-group">
            <label>Line Density (Resolution) <span id="densityVal" class="val-display">500</span></label>
            <input type="range" id="density" min="50" max="2000" value="500">
        </div>

        <div class="control-group">
            <label>Line Colour</label>
            <input type="color" id="lineColor" value="#00adb5">
        </div>

        <button id="btnPng">Export as PNG</button>
    </div>

    <div id="canvas-container">
        <canvas id="geoCanvas" width="800" height="800"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('geoCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        const els = {
            mode: document.getElementById('mode'),
            freq: document.getElementById('freq'), freqVal: document.getElementById('freqVal'),
            amp: document.getElementById('amp'), ampVal: document.getElementById('ampVal'),
            radius: document.getElementById('radius'), radiusVal: document.getElementById('radiusVal'),
            density: document.getElementById('density'), densityVal: document.getElementById('densityVal'),
            lineColor: document.getElementById('lineColor')
        };

        Object.keys(els).forEach(key => {
            if(els[key].type === 'range') {
                els[key].addEventListener('input', (e) => {
                    els[key+'Val'].innerText = e.target.value;
                    draw();
                });
            }
        });
        els.mode.addEventListener('change', draw);
        els.lineColor.addEventListener('input', draw);

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const mode = els.mode.value;
            const freq = parseInt(els.freq.value);
            const amp = parseInt(els.amp.value);
            const baseRadius = parseInt(els.radius.value);
            const steps = parseInt(els.density.value);
            
            ctx.strokeStyle = els.lineColor.value;
            ctx.lineWidth = 1.5;

            if (mode === 'polarWave') {
                // Generates the spiky, wrapped waveform from your first image
                ctx.beginPath();
                for (let i = 0; i <= steps; i++) {
                    let theta = (i / steps) * Math.PI * 2;
                    // Fast oscillation modulated by a slower envelope
                    let r = baseRadius + (Math.sin(theta * freq) * amp);
                    
                    // Draw lines from an inner circle to the outer calculated radius to get that hatched look
                    let innerX = cx + (baseRadius - 50) * Math.cos(theta);
                    let innerY = cy + (baseRadius - 50) * Math.sin(theta);
                    let outerX = cx + r * Math.cos(theta);
                    let outerY = cy + r * Math.sin(theta);
                    
                    ctx.moveTo(innerX, innerY);
                    ctx.lineTo(outerX, outerY);
                }
                ctx.stroke();

            } else if (mode === 'mandala') {
                // Generates the overlapping sacred geometry from your second image
                let circles = freq; // repurposing the slider for circle count
                let offset = amp;   // repurposing amplitude for offset distance
                
                for (let i = 0; i < circles; i++) {
                    let theta = (i / circles) * Math.PI * 2;
                    let x = cx + offset * Math.cos(theta);
                    let y = cy + offset * Math.sin(theta);
                    
                    ctx.beginPath();
                    ctx.arc(x, y, baseRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        document.getElementById('btnPng').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `geometric-pattern.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        draw(); // Initial render
    </script>
</body>
</html>
